name: Backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: simple_blog_test
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d simple_blog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://blog:blog@localhost:5432/simple_blog_test
      TEST_DATABASE_URL: postgresql+asyncpg://blog:blog@localhost:5432/simple_blog_test
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-secret-that-is-long-enough-for-ci
      RELOAD: "false"
      COOKIE_SECURE: "false"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: pip install pip-audit
      - run: alembic upgrade head
      - run: ruff check src tests
      - run: pip-audit -r requirements.lock
      - run: pytest -q tests

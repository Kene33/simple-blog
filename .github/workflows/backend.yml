name: Backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: simple_blog_test
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d simple_blog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://blog:blog@localhost:5432/simple_blog_test
      TEST_DATABASE_URL: postgresql+asyncpg://blog:blog@localhost:5432/simple_blog_test
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-secret-that-is-long-enough-for-ci
      RELOAD: "false"
      COOKIE_SECURE: "false"
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: http://127.0.0.1:8101,http://127.0.0.1:8102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: pip install pip-audit
      - run: alembic upgrade head
      - run: ruff check src tests
      - run: pip-audit -r requirements.lock
      - run: pytest -q tests
      - name: Verify two-instance realtime delivery
        run: |
          uvicorn src.main:app --host 127.0.0.1 --port 8101 >/tmp/simple-blog-a.log 2>&1 &
          echo $! >/tmp/simple-blog-a.pid
          uvicorn src.main:app --host 127.0.0.1 --port 8102 >/tmp/simple-blog-b.log 2>&1 &
          echo $! >/tmp/simple-blog-b.pid
          trap 'kill $(cat /tmp/simple-blog-a.pid) $(cat /tmp/simple-blog-b.pid)' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8101/health/live
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8102/health/live
          curl --fail -o /dev/null -w '%{http_code}\n' -H 'content-type: application/json' -d '{"username":"ci_e2e_a","email":"ci_e2e_a@example.com","password":"strong-test-password"}' http://127.0.0.1:8101/api/v1/auth/register
          curl --fail -o /dev/null -w '%{http_code}\n' -H 'content-type: application/json' -d '{"username":"ci_e2e_b","email":"ci_e2e_b@example.com","password":"strong-test-password"}' http://127.0.0.1:8102/api/v1/auth/register
          MESSAGING_INSTANCE_A=http://127.0.0.1:8101 \
          MESSAGING_INSTANCE_B=http://127.0.0.1:8102 \
          MESSAGING_IDENTIFIER_A=ci_e2e_a \
          MESSAGING_PASSWORD_A=strong-test-password \
          MESSAGING_IDENTIFIER_B=ci_e2e_b \
          MESSAGING_PASSWORD_B=strong-test-password \
          python scripts/check_two_instance_realtime.py

[project]
name = "simple-blog"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "SQLAlchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "greenlet>=3.0,<4.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "PyJWT>=2.8,<3.0",
    "email-validator>=2.1,<3.0",
    "boto3>=1.34,<2.0",
    "filetype>=1.2,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.0,<2.0",
    "redis>=5.0,<6.0",
    "Pillow>=12.3.0,<13.0",
    "pywebpush>=2.0,<3.0",
    "websockets>=13,<16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["postgres: requires TEST_DATABASE_URL", "redis: requires REDIS_URL"]

[tool.ruff]
target-version = "py312"
line-length = 180

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
